server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ALB health check
    location = /nginx-health { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Finalized static legal/support pages (bilingual privacy etc.)
    location = /privacy      { try_files /privacy.html =404; add_header Cache-Control "public, max-age=300"; }
    location = /privacy.html { try_files /privacy.html =404; add_header Cache-Control "public, max-age=300"; }
    location = /terms        { try_files /terms.html   =404; add_header Cache-Control "public, max-age=300"; }
    location = /terms.html   { try_files /terms.html   =404; add_header Cache-Control "public, max-age=300"; }
    location = /support      { try_files /support.html =404; add_header Cache-Control "public, max-age=300"; }
    location = /support.html { try_files /support.html =404; add_header Cache-Control "public, max-age=300"; }
    location = /docs         { try_files /docs.html    =404; add_header Cache-Control "public, max-age=300"; }
    location = /docs.html    { try_files /docs.html    =404; add_header Cache-Control "public, max-age=300"; }

    # Long-cache hashed bundle. Namespaced under /mkt-assets/ (not /assets/)
    # so we don't collide with the dashboard app that shares this host and
    # owns /assets/*. Kept as an exact prefix so a missing file 404s instead
    # of falling through to index.html.
    location /mkt-assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }

    # SPA fallback (React Router handles /de, /en, and their subpages)
    location / { try_files $uri $uri/ /index.html; }
}
