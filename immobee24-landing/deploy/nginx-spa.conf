server {
    # Port 8080, not 80: in AWS account 951395863325 the shared task SG
    # (sg-081209159e93566fa) only admits the ALB SG on 8080, matching the
    # dashboard's container port. Using 8080 avoids widening the shared SG.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ALB health check
    location = /nginx-health { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

    # Canonical host: 301 www -> non-www so Google indexes a single hostname
    # (https://immob24.com). The ALB already upgrades http -> https at the
    # listener; this collapses the www duplicate. Health checks hit by IP, not
    # the www host, so they're unaffected.
    if ($host = www.immob24.com) { return 301 https://immob24.com$request_uri; }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Emit RELATIVE Location headers. Without this nginx expands every
    # `return 301 /path` into an absolute URL built from the container's own
    # listen port and scheme — i.e. http://immob24.com:8080/... — which is
    # wrong on both counts behind the TLS-terminating ALB (leaks port 8080
    # and downgrades https to http). Relative Locations are resolved by the
    # browser against the real scheme+host. The explicit www -> non-www 301
    # below stays absolute because it spells out its own scheme and host.
    absolute_redirect off;

    # --- Real 301s for pages the unified-IA rework merged away -------------
    # These URLs also have <Navigate> routes in App.tsx, but those are
    # client-side: the server answers 200 with the SPA shell and only then
    # does JS rewrite the location. Google treats that as a soft redirect —
    # the dead URL lingers in the index as a duplicate and link equity does
    # not consolidate. A server 301 is unambiguous and needs no JS. The
    # React routes stay as a fallback for in-app navigation.
    # NOTE: redirect straight to the FINAL destination — no 301 chains.
    location = /de/how-it-works          { return 301 /de/produkt#how-it-works; }
    location = /en/how-it-works          { return 301 /en/product#how-it-works; }
    location = /fr/comment-ca-marche     { return 301 /fr/produit#how-it-works; }
    location = /ar/how-it-works          { return 301 /ar/product#how-it-works; }

    location = /de/demo                  { return 301 /de/kontakt?intent=demo; }
    location = /en/demo                  { return 301 /en/contact?intent=demo; }
    location = /fr/demo                  { return 301 /fr/contact?intent=demo; }
    location = /ar/demo                  { return 301 /ar/contact?intent=demo; }

    location = /de/beta-agentenprogramm  { return 301 /de/preise#beta; }
    location = /en/beta-agent-program    { return 301 /en/pricing#beta; }
    location = /fr/programme-beta-agents { return 301 /fr/tarifs#beta; }
    location = /ar/beta-agent-program    { return 301 /ar/pricing#beta; }

    # Legacy English slugs (App.tsx pointed /en/beta-program at another
    # redirect — collapsed here to the final target).
    location = /en/beta-program          { return 301 /en/pricing#beta; }
    location = /en/crm-alternative       { return 301 /en/real-estate-crm-alternative; }

    # Bare root -> the German home. The SPA did this client-side (200 + JS);
    # a 301 makes /de the unambiguous canonical entry point.
    location = / { return 301 /de; }

    # Finalized static legal/support pages (bilingual privacy etc.)
    location = /privacy      { try_files /privacy.html =404; add_header Cache-Control "public, max-age=300"; }
    location = /privacy.html { try_files /privacy.html =404; add_header Cache-Control "public, max-age=300"; }
    location = /terms        { try_files /terms.html   =404; add_header Cache-Control "public, max-age=300"; }
    location = /terms.html   { try_files /terms.html   =404; add_header Cache-Control "public, max-age=300"; }
    location = /support      { try_files /support.html =404; add_header Cache-Control "public, max-age=300"; }
    location = /support.html { try_files /support.html =404; add_header Cache-Control "public, max-age=300"; }
    location = /docs         { try_files /docs.html    =404; add_header Cache-Control "public, max-age=300"; }
    location = /docs.html    { try_files /docs.html    =404; add_header Cache-Control "public, max-age=300"; }

    # Long-cache hashed bundle. Namespaced under /mkt-assets/ (not /assets/)
    # so we don't collide with the dashboard app that shares this host and
    # owns /assets/*. Kept as an exact prefix so a missing file 404s instead
    # of falling through to index.html.
    location /mkt-assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }

    # SPA fallback (React Router handles /de, /en, and their subpages)
    location / { try_files $uri $uri/ /index.html; }
}
