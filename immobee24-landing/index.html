<!doctype html>
<html lang="de" class="dark">

<head>
  <!--
    Tracking scripts (Google Analytics, Meta Pixel) are loaded conditionally
    from src/lib/consent.ts AFTER the visitor consents to the matching cookie
    category. Do not re-add unconditional <script> tags here — that would
    fire trackers before consent (TTDSG §25 / GDPR violation).
  -->

  <meta charset="UTF-8" />
  <!-- Dark-only theme: paint the ground before CSS/JS load (no white flash) -->
  <style>html.dark{background-color:#17140F;color-scheme:dark}html.dark body{background-color:#17140F}</style>
  <script>try{if(localStorage.getItem('immob24-theme')==='light'){document.documentElement.classList.remove('dark');document.documentElement.style.backgroundColor='#FBF9F4'}}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!--
    Page-level meta (title, description, canonical, hreflang, og:url, og:title,
    og:description, twitter:*) is injected per-route by usePageMeta. The values
    below are the safe fallbacks shown before React mounts (e.g. for the
    /de homepage / for crawlers that fetch the static HTML).
  -->
  <title>KI-Maklersoftware für Immobilienmakler | Immob24</title>
  <meta name="title" content="KI-Maklersoftware für Immobilienmakler | Immob24" />
  <meta name="description" content="Immob24 ist die KI-Maklersoftware für Immobilienmakler in Deutschland. Beantworten Sie neue Anfragen in 3 Sekunden, qualifizieren Sie Leads automatisch." />
  <meta name="keywords" content="KI für Immobilienmakler, Immobilienmakler Software, Immobilien Anfragen automatisieren, Lead-Qualifizierung Immobilien, CRM Alternative Immobilienmakler, Immob24" />
  <meta name="author" content="Immob24" />
  <!--
    Public launch: the site is discoverable. This is the default for every
    route; individual routes can override via useDocumentMeta({ robots }).
    Pages that must stay out of the index (e.g. post-conversion thank-you
    pages) set "noindex, nofollow" per-route in their component.
  -->
  <meta name="robots" content="index, follow" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="de_DE" />
  <meta property="og:locale:alternate" content="en_US" />
  <meta property="og:url" content="https://immob24.com/" />
  <meta property="og:title" content="KI-Maklersoftware für Immobilienmakler | Immob24" />
  <meta property="og:description" content="Immob24 ist die KI-Maklersoftware für Immobilienmakler in Deutschland. Beantworten Sie neue Anfragen in 3 Sekunden, qualifizieren Sie Leads automatisch." />
  <meta property="og:image" content="https://immob24.com/og-image.png" />
  <meta property="og:site_name" content="Immob24" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://immob24.com/" />
  <meta property="twitter:title" content="KI-Maklersoftware für Immobilienmakler | Immob24" />
  <meta property="twitter:description" content="Immob24 ist die KI-Maklersoftware für Immobilienmakler in Deutschland. Beantworten Sie neue Anfragen in 3 Sekunden, qualifizieren Sie Leads automatisch." />
  <meta property="twitter:image" content="https://immob24.com/og-image.png" />

  <!-- Canonical fallback for crawlers that read static HTML. React overrides per-route. -->
  <link rel="canonical" href="https://immob24.com/" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />

  <!--
    Fonts are self-hosted via @fontsource packages imported in src/main.tsx.
    Do not re-add a remote-fonts stylesheet here — that would transmit the
    visitor IP to a third party on every page load (LG München I, 3 O 17493/20,
    20.01.2022 ruled this is a GDPR violation without consent).
  -->

  <!--
    Structured data (Organization, SoftwareApplication, BreadcrumbList, HowTo,
    Product, FAQPage) is injected per-route by useJsonLd / useFaqSchema so each
    page carries only the schema that matches its content. Nothing is declared
    statically here — a site-wide block would attach product/pricing schema to
    pages it does not describe.
  -->

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
